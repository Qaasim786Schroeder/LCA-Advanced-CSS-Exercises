<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Showcase</title>
    <link rel="stylesheet" href="week5_ex01_style.css" />
  </head>
  <body>
    <header>
      <h1>Featured Tech Products</h1>
    </header>

    <main class="product-container">
      <!-- Repeating this card structure 6 times -->
      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" />
        <h3>Wireless Headphones</h3>
        <p class="price">R 1,299.00</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" />
        <h3>Smart Watch</h3>
        <p class="price">R 3,450.00</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" />
        <h3>Mechanical Keyboard</h3>
        <p class="price">R 850.00</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" />
        <h3>Gaming Mouse</h3>
        <p class="price">R 550.00</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" />
        <h3>Portable SSD</h3>
        <p class="price">R 1,800.00</p>
        <button class="add-btn">Add to Cart</button>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Product Image" />
        <h3>Webcam HD</h3>
        <p class="price">R 950.00</p>
        <button class="add-btn">Add to Cart</button>
      </article>
    </main>
  </body>
</html>
