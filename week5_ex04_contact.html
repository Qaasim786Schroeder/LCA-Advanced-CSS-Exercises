<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | TechVault</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="week5_ex04_index.html">TechVault</a>
        <div class="navbar-nav">
          <a class="nav-link" href="week5_ex04_index.html">Home</a>
          <a class="nav-link" href="week5_ex04_products.html">Products</a>
          <a class="nav-link" href="week5_ex04_about.html">About</a>
          <a class="nav-link active" href="week5_ex04_contact.html">Contact</a>
        </div>
      </div>
    </nav>

    <main class="container my-5" style="max-width: 600px">
      <h2 class="text-center mb-4">Contact Our Team</h2>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="John Doe"
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="name@example.com"
          />
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" rows="4"></textarea>
        </div>
        <button
          type="submit"
          class="btn btn-primary w-100"
          onclick="
            event.preventDefault();
            alert('Message sent (Mock)!');
          "
        >
          Send Email
        </button>
      </form>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
      <p>&copy; 2026 TechVault Inc. | Built with Bootstrap</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
